<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="root"></div>
    
    <!-- while working with node_modules and npm, we dont neet to include react and react-dom in the index.html file.
    instead, we will import them in the App.js file.
    * run npm i react react-dom to install react and react-dom in the node_modules folder. -->

    
    <!-- <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> -->
    
    <script type="module" src="./App.js"></script>  

    <!-- type="module" is used to import the App.js file as a module.

    module is a new feature in JavaScript that allows us to import and export code between different files.
    it is used to break the code into smaller files and make it more manageable. -->
</body>
</html>
